# Weekly dependency update checks. requirements.txt is a full pin lock
# generated by scripts/lock.sh (see that script's header comment) --
# letting Dependabot bump pins directly here is fine; it's doing the same
# kind of edit lock.sh would, just one dependency at a time instead of a
# full regeneration. Re-running scripts/lock.sh after merging a batch of
# these is still the way to pick up transitive-dependency updates
# Dependabot itself won't propose (see README's Local development
# section).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A new anthropic major has so far meant a new API version (2.x moved
      # to 2026-10-21, which refuses temperature), and CI can't see what a
      # new API version breaks: the tests use a fake Claude, so a major-bump
      # PR goes green either way. Majors are a deliberate change with a check
      # against the real API, not a Dependabot bump (2.x was taken that way
      # on 2026-10-22; this now holds 3.x back).
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
