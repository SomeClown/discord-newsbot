# Weekly dependency update checks. requirements.txt is a full pin lock
# generated by scripts/lock.sh (see that script's header comment) --
# letting Dependabot bump pins directly here is fine; it's doing the same
# kind of edit lock.sh would, just one dependency at a time instead of a
# full regeneration. Re-running scripts/lock.sh after merging a batch of
# these is still the way to pick up transitive-dependency updates
# Dependabot itself won't propose (see README's Local development
# section).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # anthropic 2.x moves to API version 2026-10-21, which refuses any
      # request that sets temperature, and summarize.py sends 0.2 on every
      # call. CI can't see that (the tests use a fake Claude), so a 2.x PR
      # would go green and then turn every comped digest into headlines.
      # Moving to 2.x is a deliberate change with an owner-reviewed
      # /newsbot preview, not a Dependabot bump (decided 2026-10-22).
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
