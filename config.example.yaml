# Example config.yaml, seeded from the source research in
# docs/sources-research.md (verified 2026-09-23) and the owner decisions at
# the bottom of that file. Copy this to config.yaml, swap the placeholder
# Discord IDs for real ones, and you have a bot that starts up and actually
# has something to say. The source list won't stay perfect forever (press
# feeds die, subreddits get rate-limited, Blizzard will probably ship an
# actual RSS feed the week after I stop checking for one), but it's a real
# starting point, not a stub.
#
# Every ID below that says "placeholder" is fake and must be replaced; the
# bot will happily start up pointed at a channel that doesn't exist and then
# fail confusingly later, which is a worse failure mode than a config error.

guild_id: 123456789012345678          # placeholder: your server's ID
admin_channel_id: 000000000000000000  # placeholder: optional, alerts go here
admin_permission: manage_guild

digest:
  # v2.0: there is no digest.channel_id here anymore; the combined
  # digest channel is gone, and each game posts to its own topics[].
  # channel_id below instead. A config still setting digest.channel_id
  # (a v1 leftover) fails validation with a message pointing at the
  # per-topic replacement; there's no silent fallback.
  time: "09:00"
  timezone: "America/Los_Angeles"
  lookback_hours: 24
  max_items_per_topic: 60
  # After every scheduled/catch-up/run-now digest that actually posts (ok
  # or partial), send a one-message plain-text status report to the admin
  # channel: story counts, source health for that run, estimated Claude
  # cost, how long it took, and a jump link. Only takes effect when
  # admin_channel_id (above) is set. Defaults to true; uncomment to turn
  # it off if the admin channel would rather only hear about failures.
  # report_to_admin: false
  # What the summarizer prompt calls the things `topics` are ("the video
  # games Borderlands 4, Palworld and Diablo IV"). Defaults to "video
  # games"; a fork tracking something else (tabletop RPG news, say) can
  # say so here instead of editing pipeline/prompts.py. Any change here
  # still needs an owner-reviewed `/newsbot preview` before merging.
  # subject: "video games"

topics:
  - key: borderlands4
    name: "Borderlands 4"
    channel_id: 111111111111111111  # placeholder: this game's own channel (v2.0)
    # Bare "Borderlands" was tempting and wrong: it also matches BL1-3, Tiny
    # Tina, the 2024 movie, and (I am not making this up) an academic
    # "Association for Borderlands Studies". "BL4" and "Borderlands4" don't
    # have that problem, so those are the whole alias list.
    aliases: ["BL4", "Borderlands4"]
    entities: ["Gearbox"]             # 2K/Take-Two dropped: they mostly bring NBA and GTA noise
    search_queries:
      - "Borderlands 4 news"
      - "Borderlands 4 update OR DLC OR patch"
  - key: palworld
    name: "Palworld"
    channel_id: 111111111111111112  # placeholder: this game's own channel (v2.0)
    aliases: []                       # the name is distinctive enough that it needs no help
    entities: ["Pocketpair"]
    search_queries:
      - "Palworld news"
      - "Palworld update OR patch OR DLC"
  - key: diablo4
    name: "Diablo IV"
    channel_id: 111111111111111113  # placeholder: this game's own channel (v2.0)
    # "D4" got dropped for the same reason "Borderlands" did: it's a chess
    # opening, a TTRPG die, and a Nikon camera before it's ever this game.
    # "Diablo V"/"Diablo 5" are in here on purpose, not by accident: Diablo V
    # was announced at BlizzCon 2026, and until it's a real product with its
    # own news volume, its coverage rides along on the Diablo IV topic. Give
    # it a topic of its own later by moving these two lines; that's the
    # whole migration.
    aliases: ["Diablo 4", "Lord of Hatred", "Vessel of Hatred", "Diablo V", "Diablo 5"]
    entities: ["Blizzard"]            # Activision Blizzard/Microsoft Gaming dropped: corporate-press noise
    search_queries:
      - "\"Diablo 4\" OR \"Diablo IV\""
      - "Diablo 4 season OR patch OR hotfix"

sources:
  # --- Official: Steam announcements (the collector adds
  # feeds=steam_community_announcements itself; without that filter these
  # apps' feeds fill up with SteamDB "top sellers" posts and a Russian press
  # aggregator, which is not what anyone signed up for) ---
  - type: steam_news
    name: "Borderlands 4 Steam"
    app_id: 1285190
    topics: [borderlands4]
    trust: official
  - type: steam_news
    name: "Palworld Steam"
    app_id: 1623730
    topics: [palworld]
    trust: official
  - type: steam_news
    name: "Diablo IV Steam"
    app_id: 2344520
    topics: [diablo4]
    trust: official

  # --- Official: RSS ---
  # news.blizzard.com has no RSS feed anywhere (checked /rss, /feed, and the
  # page's autodiscovery: nothing). The Diablo IV forums' Blizzard Tracker
  # group feed is the next best thing: it mirrors every official post,
  # including the news.blizzard.com articles, hotfix notes and PSAs, via
  # Discourse's per-group RSS. It's a little noisier than a real news feed
  # (a CM's reply in a random thread shows up under that thread's title, and
  # a busy hotfix thread can appear two or three times), but clustering
  # handles the duplicates and it's strictly better than Steam, where
  # Diablo IV's official posts land about once a month.
  - type: rss
    name: "Diablo IV Blizzard Tracker"
    url: "https://us.forums.blizzard.com/en/d4/groups/blizzard-tracker/posts.rss"
    topics: [diablo4]
    trust: official
  # gearboxsoftware.com/feed still resolves but hasn't posted since 2021;
  # borderlands.2k.com has no feed at all. The 2K Newsroom is the closest
  # thing to an official Borderlands press feed, at the cost of also
  # covering NBA, WWE and Civ; it's unscoped on purpose, so the keyword
  # matcher decides what's relevant.
  # YouTube channel feeds (youtube.com/feeds/videos.xml?channel_id=...) used
  # to live here, one per game plus Gearbox. Every one of them, and every
  # other channel's feed we tried, started returning 404 in late September
  # 2026 while YouTube itself reported nothing wrong, so they're out until
  # `--check-sources` says otherwise.
  - type: rss
    name: "2K Newsroom"
    url: "https://newsroom.2k.com/feed/rss"
    trust: official
  # The official Bluesky accounts work fine over plain RSS, no app password
  # needed; that's only required for *searching* Bluesky (see the
  # bluesky_search sources below). These are cheap to keep even when quiet:
  # Palworld's account hasn't posted since June, and that's fine, it'll just
  # show "0 items" on the source health report instead of causing a fuss.
  - type: rss
    name: "Borderlands Bluesky"
    url: "https://bsky.app/profile/did:plc:sxmjis6jypsib2k7rk6pjoau/rss"
    topics: [borderlands4]
    trust: official
  - type: rss
    name: "Palworld Bluesky"
    url: "https://bsky.app/profile/did:plc:g3nrnn7t2tvoekp5flrexiby/rss"
    topics: [palworld]
    trust: official
  - type: rss
    name: "Diablo Bluesky"
    url: "https://bsky.app/profile/did:plc:wxfwmaqg4kgiwzxcygdt2myj/rss"
    topics: [diablo4]
    trust: official

  # --- Community: subreddits ---
  # /top/.rss?t=day, not /new/.rss: /new only returns the 25 newest posts,
  # and on a subreddit that gets bug reports and help threads all day, a
  # once-a-day run would see whatever happened to post in the last hour
  # rather than what people actually cared about. /top with t=day gets the
  # day's 25 highest-voted posts instead.
  # Reddit rate-limits hard, even from a residential IP: five feeds fired
  # at once got one 200 and four 429s, and 45 seconds of spacing cleared it
  # up. The collector's `run_collectors` fires sources concurrently, so
  # these three need serialized fetching or a per-host pause. It also might
  # just block the production box's IP outright; I only tested from home.
  # If that happens, the source health report will show it, not a crash.
  - type: rss
    name: "r/Borderlands4"
    url: "https://www.reddit.com/r/Borderlands4/top/.rss?t=day"
    topics: [borderlands4]
    trust: community
  - type: rss
    name: "r/Palworld"
    url: "https://www.reddit.com/r/Palworld/top/.rss?t=day"
    topics: [palworld]
    trust: community
  - type: rss
    name: "r/diablo4"
    url: "https://www.reddit.com/r/diablo4/top/.rss?t=day"
    topics: [diablo4]
    trust: community

  # --- Press: wide-coverage feeds, no `topics`, so the keyword matcher
  # decides what belongs where ---
  - type: rss
    name: "PC Gamer"
    url: "https://www.pcgamer.com/rss/"
    trust: press
  - type: rss
    name: "Eurogamer"
    url: "https://www.eurogamer.net/feed"
    trust: press
  - type: rss
    name: "GamesRadar+"
    url: "https://www.gamesradar.com/rss/"
    trust: press
  - type: rss
    name: "PCGamesN"
    url: "https://www.pcgamesn.com/mainrss.xml"
    trust: press

  # --- Community: Bluesky search ---
  # These are here so the config is ready the day you're willing to make a
  # Bluesky app password; until BLUESKY_HANDLE and BLUESKY_APP_PASSWORD are
  # both set, every one of these three gets skipped, not attempted. That's
  # not a guess: an unauthenticated search against Bluesky's public API
  # returns a 403 whose body is HTML from BunnyCDN, not even a proper JSON
  # error. The official-account RSS feeds above don't need auth and keep
  # working regardless, so skipping these only costs you the wider
  # "anyone talking about it" search, not the official accounts themselves.
  - type: bluesky_search
    query: "\"Borderlands 4\""
    topics: [borderlands4]
    trust: community
  - type: bluesky_search
    query: "Palworld"
    topics: [palworld]
    trust: community
  - type: bluesky_search
    query: "\"Diablo 4\""
    topics: [diablo4]
    trust: community

  # --- Press: Brave News search, catches outlets not in the RSS list above ---
  # Each topic sets its own search_queries (see above), because the default
  # template guesses "{name} news" (which for Diablo IV becomes literally
  # "Diablo IV news") and most of the press writes "Diablo 4". A topic
  # without search_queries falls back to query_templates below; right now
  # every topic here has its own, so the templates are just the safety net
  # for whatever topic gets added next without an owner reviewing its
  # queries first.
  - type: web_search
    queries_per_topic: 2
    trust: press

# SHiFT code alerts (design.md §12, v1.2): an hourly sweep separate from
# the daily digest that posts any new SHiFT/Golden Key redeem code it finds,
# with an @everyone ping (once per code, ever, capped per day). This is
# specifically the Borderlands-family redeem code format
# (XXXXX-XXXXX-XXXXX-XXXXX-XXXXX); it doesn't recognize any other game's
# codes, so leave this block out entirely for a game that isn't a
# Borderlands title. Commented out by default (AlertsCfg.enabled defaults
# to False with the block entirely absent too, but writing it out and
# commenting it is the more honest "here's what turning this on actually
# looks like" than making an owner go read config.py to find the field
# names) and opt-in on purpose: turning it on means the bot can @everyone
# your whole server, so know what that means in your own server before
# you uncomment it. Fill in topics for your own game list, and see
# README.md's "SHiFT code alerts" section and docs/deploy.md before
# flipping enabled to true in prod: the bot's role needs the "Mention
# @everyone, @here, and All Roles" permission in the SHiFT codes channel,
# or the ping silently gets dropped.
# alerts:
#   enabled: true
#   # v2.0: SHiFT alerts get their own dedicated channel now, separate from
#   # every game's digest channel; required once enabled is true, no
#   # fallback to a game channel or the admin channel.
#   channel_id: 111111111111111114  # placeholder: a channel just for this
#   # Scope the sweep to specific topic keys (A6); empty means every
#   # topic, but a code from an unrelated game pinging the whole server
#   # is a worse default than a deliberate, narrow list. Borderlands 4 is
#   # the game that actually has SHiFT codes among the three this example
#   # config tracks; Palworld and Diablo IV don't use this reward system.
#   topics: [borderlands4]
#   interval_minutes: 60
#   max_item_age_hours: 48
#   # 3 pings a day is the shipped default. For a quiet start, set this to
#   # 0: codes still get recorded and are visible via /shift codes, just
#   # never with an @everyone attached, until you decide you want the
#   # ping. At 0, the bot's role doesn't even need the "Mention @everyone"
#   # permission in the SHiFT channel; the startup permission check knows
#   # that and won't flag it as missing.
#   max_pings_per_day: 3
#   # Which sources can trigger the @everyone ping (QA item 7 option A):
#   # every new code still posts regardless of trust, this only decides
#   # whether the batch it's in pings. community-only codes always post
#   # quietly.
#   ping_trust: [official, press]
#   # An item naming more than this many distinct codes is a roundup or
#   # megathread, not a genuine single-code announcement; its codes are
#   # recorded silently ('roundup') and never alert (QA item 7).
#   max_codes_per_item: 5
#   # WARNING: this registers /newsbot test-alert, which lets any admin
#   # post a fake code alert (with a real @everyone ping, cap and
#   # once-per-code guard included) on demand. Meant for the private test
#   # guild only; leave this false (or the whole alerts: block out) in
#   # a production config. config.py logs a startup warning if it's true.
#   allow_test_command: false

# Lounge welcomes and a daily quote (design.md §14, v2.2). Two optional
# features that share one channel, both off unless you uncomment this block.
# Full walkthrough: docs/self-host.md ("Lounge welcomes and a daily quote").
#
# FIRST, if you turn on the welcome: in the Discord Developer Portal, open
# your application's Bot page and switch on Server Members Intent (under
# Privileged Gateway Intents) BEFORE you start the bot. Without it the bot
# prints a message naming that switch, waits 10 minutes (so a restart loop
# can't burn through Discord's login limit), and exits. The daily quote needs
# no privileged intent. The bot's role needs View Channel and Send Messages
# in the lounge channel; the startup permission check will say if not.
#
# lounge:
#   channel_id: 111111111111111115  # placeholder: required if either feature is on
#   welcome:
#     enabled: true
#     # Posted once for each new member, as written, so formatting, emoji and
#     # <#channel-id> links work. Two placeholders exist: {member} (a mention
#     # of the new member) and {server} (the server's name). Any other {...}
#     # is a startup error, so a typo fails loudly instead of posting
#     # literally, and the message has to fit Discord's 2,000-character limit
#     # even with a worst-case mention swapped in (also checked at startup).
#     # Bots are never welcomed. This is the owner's own welcome, kept as an
#     # example; the <#..._ID> bits stand in for real channel ids.
#     message: |
#       **You met me at a very strange time in my life.**
#
#       Welcome to {server}, {member}. Pull up a stool. The bartender is a bot, the lighting is questionable, and nobody here will ask where you were before you walked in.
#
#       A few things worth knowing, in rough order of importance:
#       - **SHiFT codes** land in <#SHIFT_CHANNEL_ID>. If it pings everyone, it's a Golden Key, and yes, you're allowed to run.
#       - **The news** for our games shows up every morning around 9 in <#BL4_CHANNEL_ID>, <#PALWORLD_CHANNEL_ID> and <#DIABLO_CHANNEL_ID>. A robot reads the internet so you don't have to, which is the single most useful thing a robot has ever done for me.
#       - **Once a day**, a quote of questionable wisdom turns up right here. Most of them are older than the building. A few are older than me, which is saying something.
#
#       That's it. No test, no dress code, and the only real rule is "don't be the reason we need more rules." Grab a drink, say hello, and try not to judge the rest of us too harshly. We were like this when you found us.
#   daily_quote:
#     enabled: true
#     # HH:MM, 24-hour, in digest.timezone. Default 08:00. A quote missed
#     # because the bot was down is skipped, never caught up. Known quirk: the
#     # scheduling library (APScheduler 3.x) skips a job set between 00:00
#     # and 00:59 on the day after the spring-forward clock change, so don't
#     # pick a midnight-hour time. The default 08:00 isn't affected.
#     time: "08:00"
#     # Where quotes come from. Leave `sources` out and the bot uses its
#     # built-in list: Wikiquote pages for Oscar Wilde, Mark Twain, Benjamin
#     # Franklin, William Shakespeare, Jane Austen, Edgar Allan Poe and Marcus
#     # Aurelius (authors whose works are in the U.S. public domain). Set it
#     # and your list replaces the built-in one. An empty list is an error;
#     # to turn the quote off, set `enabled: false`. Each day picks one
#     # source at random, then a quote from it that hasn't been used yet;
#     # every source has its own no-repeat deck. Each entry is exactly one of:
#     sources:
#       # A Wikiquote page title. Fetched through Wikiquote's API at most once
#       # a week per page (the bot sends your NEWSBOT_CONTACT in its
#       # User-Agent, so set it), with the saved copy used in between and if
#       # the fetch fails. Quotes over 400 characters are dropped. Posts link
#       # back to the page, which Wikiquote's CC BY-SA license asks for.
#       - wikiquote: "Oscar Wilde"
#       # A text file of your own, in the `fortune` format: quotes separated
#       # by a line holding only `%`. Read fresh every time, so edits need no
#       # restart. UTF-8, 1 MB at most. A relative path is relative to this
#       # config file. In Docker the image is read-only, so keep the file in
#       # the data directory (as below) and make sure uid 10001 can read it.
#       - file: /data/quotes.txt
#       # A raw text file at an https:// address, in the same `%` format.
#       # Plain http:// is rejected. It has to be served as text/plain; the
#       # link to a gist's or GitHub's web page is HTML and will be refused,
#       # so use the "raw" link. Fetched every time it's picked (1 MB and 10
#       # seconds at most).
#       - url: https://gist.githubusercontent.com/you/abc123/raw/quotes.txt
#       # Modern copyrighted works, deliberately NOT on by default. Wikiquote
#       # hosts limited excerpts of films, recent books and the like under
#       # its own fair-use policy. That covers Wikiquote; a bot reposting
#       # them every morning is a different use, and it carries real
#       # copyright risk. Turning these on is your call, made with eyes open.
#       # Titles ending in "(film)", "(TV series)" or "(video game)" are read
#       # as works and attributed "Character, Title". Theme pages like
#       # "Friendship" mix public-domain and modern quotes the same way, so
#       # they get the same caution (and only quotes that cite a source are
#       # used). These show the shape; check the titles exist first.
#       # - wikiquote: "Fight Club (film)"
#       # - wikiquote: "Hunter S. Thompson"
#       # - wikiquote: "Friendship"
#
# To try it without waiting for the clock, an admin can run
# `/newsbot quote-now`. It posts today's quote and the scheduled run then
# skips today; if today's already posted it asks before posting another.
# It exists only while daily_quote is enabled.
