# Production overlay: `docker compose -f docker-compose.yml -f
# docker-compose.prod.yml pull && docker compose -f docker-compose.yml -f
# docker-compose.prod.yml up -d`. See docs/deploy.md for the full Droplet
# runbook (rollback by TAG, log viewing, restore-from-backup).
#
# GHCR_OWNER defaults to `someclown`, now that the repo (public,
# github.com/SomeClown/discord-newsbot) and image
# (ghcr.io/someclown/discord-newsbot, also public) are both settled. It's
# still a variable, not hardcoded into the image reference, in case that
# ever needs to change -- override it in the Droplet's .env or the shell
# if so.
#
# `env_file: .env` lives here, not in the base docker-compose.yml -- see
# that file's comment for why that split matters (it's what stops a
# variable missing from .env.dev from silently falling back to whatever's
# in this file's .env).
#
# IMPORTANT -- only ONE instance of this bot may run per Discord bot
# token, ever (see CLAUDE.md and docker-compose.yml).

services:
  newsbot:
    image: ghcr.io/${GHCR_OWNER:-someclown}/discord-newsbot:${TAG:-latest}
    env_file: .env
    environment:
      NEWSBOT_DB: /data/newsbot.db
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
