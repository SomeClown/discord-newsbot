[project]
name = "newsbot"
version = "3.0.5"
description = "Daily AI-summarized Discord news digest for a small gaming server."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "discord.py>=2.4,<3",
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "pydantic>=2,<3",
  "anthropic>=1.11.0,<2",
  "pyyaml>=6,<7",
  "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsbot*"]

[tool.setuptools.package-data]
newsbot = ["store/migrations/*.sql"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest's whole idiom is `assert`; banning it in tests would just mean
# writing our own assert wrapper, which is a worse version of pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The backstop for tests/async_watchdog.py: a test stuck in synchronous code (where the
# watchdog's timer on the loop can't fire) at least gets its thread stacks dumped. It
# doesn't fail the test, it just tells you where to look while you go for the Ctrl-C.
faulthandler_timeout = 120
markers = [
  "real_network: skip tests/network_guard.py's network guard (real DNS, real sockets)",
]
filterwarnings = [
  # discord.py calls re.sub with a positional `count` arg, which is fine on
  # the Python versions it was written against and merely deprecated on
  # 3.14. Not our code, not our bug to fix; scoped tight so an unrelated
  # DeprecationWarning we should actually see doesn't get swallowed with it.
  "ignore:'count' is passed as positional argument:DeprecationWarning:discord\\.utils",
]
