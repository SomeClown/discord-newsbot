# The smallest config.yaml that actually does something: one game, three
# sources, no SHiFT alerts. config.example.yaml is the full, three-game,
# fifteen-source config this bot actually runs in production, which is a
# great reference and a slightly overwhelming place to start. This is the
# other end: copy it to config.yaml and start replacing placeholders.
#
# Three separate kinds of placeholder below all need real values before
# this actually works, not just before it starts up:
#   - Every Discord ID (`guild_id`, `admin_channel_id`, each topic's
#     `channel_id`): the bot will happily start up pointed at a channel
#     that doesn't exist and then fail confusingly later, which is a worse
#     failure mode than a config error at startup.
#   - The Steam source's `app_id` (1234567 is fake and returns a 403).
#   - The RSS source's `url` (example.com isn't a feed and returns a 404).
# Run `python -m newsbot.pipeline.run --config config.yaml --check-sources`
# once you've replaced them, before spending a Discord post or a Claude
# call on finding out the hard way; see docs/self-host.md step 6.

guild_id: 123456789012345678          # placeholder: your server's ID
admin_channel_id: 123456789012345679  # placeholder: optional; alerts go here
admin_permission: manage_guild

digest:
  time: "09:00"
  timezone: "America/Los_Angeles"     # set this to your own timezone; any IANA zone, see /usr/share/zoneinfo or `timedatectl list-timezones`
  lookback_hours: 24
  max_items_per_topic: 60

topics:
  # One game to start. `key` has to be lowercase letters/digits/underscore
  # and is what shows up in the database and slash-command choices;
  # `name` is what actually gets posted and said to the model. Copy this
  # block for a second game once you're happy with the first: each one
  # needs its own channel_id (v2.0: there's no shared digest channel
  # anymore, every game posts to its own).
  - key: yourgame
    name: "Your Game"
    channel_id: 111111111111111111  # placeholder: this game's own channel
    aliases: []          # alternate names/abbreviations worth matching, if the name alone is ambiguous
    entities: []          # a studio/publisher name worth a looser (marked "uncertain") match
    search_queries:       # literal Brave News queries for this topic; see docs/finding-sources.md
      - "Your Game news"
      - "Your Game update OR patch OR DLC"

sources:
  # A dedicated source: it names exactly one topic, so every item it
  # returns counts as a confident match for that topic even if the text
  # never says the game's name (design.md §4). Steam announcements are the
  # easiest of these to find; see docs/finding-sources.md for how to get
  # the app_id.
  - type: steam_news
    name: "Your Game Steam"
    app_id: 1234567  # placeholder: steamdb.info or the store URL has this
    topics: [yourgame]
    trust: official

  # A general games-press RSS feed (a developer blog, a subreddit's
  # /top/.rss?t=day, a site's own /feed): no `topics` here, on purpose.
  # A source naming exactly one topic is a *dedicated source* (see
  # config.example.yaml and docs/finding-sources.md's "dedicated-source
  # rule"): every item it returns counts as a confident match for that
  # topic even if the game's name never comes up, which is right for an
  # official blog but wrong for a wide-coverage feed that covers other
  # games too. Leaving `topics` off here means the keyword matcher (this
  # topic's `name`/`aliases`) decides what actually belongs.
  - type: rss
    name: "Your Game News"
    url: "https://example.com/feed.xml"  # placeholder: a real feed URL
    trust: press

  # Brave News search, catching outlets not already covered by name
  # above. Needs BRAVE_API_KEY in .env to actually run; without it,
  # load_config disables this source with a startup warning instead of
  # failing, and --check-sources will say the same thing plainly.
  - type: web_search
    queries_per_topic: 2
    trust: press

# SHiFT code alerts (design.md §12) are Borderlands-family only and stay
# off by default (AlertsCfg.enabled defaults to False even with this
# whole block absent, same as here); there's nothing to uncomment for a
# minimal single-topic start. See config.example.yaml's own alerts: block
# and README.md's "SHiFT code alerts" section if your game actually has
# redeem codes and you want the hourly sweep.

# Lounge welcomes and a daily quote (design.md §14) are optional and off
# unless a `lounge:` block is present. A welcome needs the Server Members
# Intent switched on in the Developer Portal first. The whole thing, every
# option explained, is the commented-out `lounge:` block at the end of
# config.example.yaml, and docs/self-host.md walks through it.
